name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint and type-check
        run: |
          ruff check .
          ruff format --check .
          mypy

      - name: Tests
        run: python -m pytest -q

      - name: Demo (no key; recorded model replies are replayed from cache/)
        run: finops-agent demo

      - name: Grounding check of the recorded explanations (offline)
        run: finops-agent eval-explain --offline --seeds 0

      - name: Upload the dashboard and digest
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: finops-report
          path: build/
