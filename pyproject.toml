[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-agent"
version = "1.0.0"
description = "Cloud cost anomaly detection, root-cause drill-down and savings advice on FOCUS billing data, priced from the public Azure and AWS price lists."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samiul Huda" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
prices = ["ijson>=3.3"]  # only needed to refresh the AWS price snapshot
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs>=2.2", "ijson>=3.3"]

[project.scripts]
finops-agent = "finops_agent.cli:main"

[tool.setuptools.packages.find]
include = ["finops_agent*"]

[tool.setuptools.package-data]
finops_agent = ["prices/snapshot.json", "report/dashboard.html"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["finops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
